<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- =====================================================
         CONFIGURATION DE BASE DE LA PAGE
         ===================================================== -->

    <!-- Permet d'afficher correctement les accents et emojis -->
    <meta charset="UTF-8">

    <!-- Rend l'application adaptée aux téléphones -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Titre de la page -->
    <title>Contrôle de présence</title>


    <!-- =====================================================
         BIBLIOTHÈQUE QR CODE
         =====================================================

         Cette bibliothèque permet d'utiliser la caméra
         du téléphone et de détecter les QR Codes.
    -->

    <script src="https://unpkg.com/html5-qrcode"></script>


    <!-- =====================================================
         STYLE DE L'APPLICATION
         ===================================================== -->

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 20px;

            text-align: center;
        }


        .container {

            max-width: 500px;

            margin: auto;

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }


        h1 {

            margin-bottom: 10px;
        }


        /*
            Zone dans laquelle la bibliothèque
            html5-qrcode va afficher la caméra.
        */

        #reader {

            width: 100%;

            margin-top: 20px;
        }


        /*
            Zone dans laquelle nous afficherons
            les résultats du scan.
        */

        #message {

            margin-top: 25px;

            font-size: 18px;

            font-weight: bold;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         INTERFACE PRINCIPALE
         ===================================================== -->

    <div class="container">


        <h1>
            📷 Contrôle de présence
        </h1>


        <p>
            Scanner les QR Codes des participants
        </p>


        <!-- =================================================
             ZONE DU SCANNER

             html5-qrcode va créer la caméra ici.
             ================================================= -->

        <div id="reader"></div>


        <!-- =================================================
             ZONE DU MESSAGE

             Nous afficherons ici :

             - QR détecté
             - Participant trouvé
             - Participant inconnu
             - Erreur
             ================================================= -->

        <div id="message">

            🔎 En attente d'un QR Code...

        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /*
            =================================================
            1. ADRESSE DE NOTRE BACKEND APPS SCRIPT
            =================================================

            C'est l'adresse qui permet à notre application
            GitHub de communiquer avec Google Apps Script.

            IMPORTANT :
            On ne met PAS "?id=..." ici.

            L'ID sera ajouté automatiquement plus bas.
        */

        const URL_BACKEND =
            "https://script.google.com/macros/s/AKfycbynCIYWydDFECiT5DbaFgL1pwajVg3pHbco0Dn3Nw9JmknfPpXEJjO3AKQxF6JJTDl72Q/exec";



        /*
            =================================================
            2. FONCTION APPELÉE LORSQU'UN QR EST DÉTECTÉ
            =================================================

            Exemple :

            QR Code
                ↓
            EVT001-P0001

            qrCodeMessage contient :

            "EVT001-P0001"
        */

        async function qrCodeDetecte(qrCodeMessage) {


            /*
                Affichage dans la console du navigateur.
            */

            console.log(
                "QR Code détecté :",
                qrCodeMessage
            );


            /*
                Récupération de la zone de message.
            */

            const message =
                document.getElementById("message");


            /*
                On informe l'utilisateur que nous sommes
                en train de contacter notre serveur.
            */

            message.innerHTML =
                "⏳ Vérification du participant...";


            /*
                =================================================
                3. CONSTRUCTION DE L'URL

                Notre URL :

                https://.../exec

                devient :

                https://.../exec?id=EVT001-P0001
                =================================================
            */

            const url =
                URL_BACKEND +
                "?id=" +
                encodeURIComponent(qrCodeMessage);


            console.log(
                "URL envoyée au backend :",
                url
            );


            /*
                =================================================
                4. COMMUNICATION AVEC APPS SCRIPT
                =================================================

                fetch() permet à notre page GitHub
                de contacter notre backend Apps Script.
            */

            try {


                const reponse =
                    await fetch(url);


                /*
                    On transforme la réponse du serveur
                    en objet JSON.
                */

                const participant =
                    await reponse.json();


                console.log(
                    "Réponse du backend :",
                    participant
                );


                /*
                    =================================================
                    5. PARTICIPANT TROUVÉ
                    =================================================
                */

                if (participant.trouve === true) {


                    message.innerHTML =

                        "🟢 PARTICIPANT TROUVÉ<br><br>" +

                        "<strong>" +

                        participant.prenom +

                        " " +

                        participant.nom +

                        "</strong><br><br>" +

                        "ID : " +

                        participant.id;


                }


                /*
                    =================================================
                    6. PARTICIPANT NON TROUVÉ
                    =================================================
                */

                else {


                    message.innerHTML =

                        "🔴 PARTICIPANT INCONNU<br><br>" +

                        "ID : " +

                        qrCodeMessage;

                }


            }


            /*
                =================================================
                7. GESTION DES ERREURS
                =================================================
            */

            catch (erreur) {


                console.error(
                    "Erreur de communication :",
                    erreur
                );


                message.innerHTML =

                    "⚠️ Impossible de communiquer avec le serveur";


            }

        }



        /*
            =====================================================
            8. FONCTION DE RECHERCHE DU QR
            =====================================================

            Cette fonction est appelée pendant que la caméra
            cherche un QR Code.

            Ce n'est PAS une erreur.

            C'est simplement le scanner qui continue
            de chercher.
        */

        function erreurScan(errorMessage) {

            console.log(
                "Recherche d'un QR Code..."
            );

        }



        /*
            =====================================================
            9. CRÉATION DU SCANNER
            =====================================================

            "reader" correspond à :

            <div id="reader"></div>

            La bibliothèque va afficher la caméra
            dans cette zone.
        */

        const scanner =

            new Html5QrcodeScanner(

                "reader",

                {

                    /*
                        Nombre d'images analysées
                        chaque seconde.
                    */

                    fps: 10,


                    /*
                        Taille de la zone de détection
                        du QR Code.
                    */

                    qrbox: 250

                }

            );



        /*
            =====================================================
            10. DÉMARRAGE DU SCANNER
            =====================================================

            Cette ligne est TRÈS IMPORTANTE.

            Elle demande à la bibliothèque :

            "Démarre la caméra et appelle
             qrCodeDetecte() lorsqu'un QR est trouvé."
        */

        scanner.render(

            qrCodeDetecte,

            erreurScan

        );
/*
 * ============================================================
 * FONCTION : qrCodeDetecte()
 * ============================================================
 *
 * Cette fonction est appelée automatiquement lorsqu'un QR
 * Code est détecté par la caméra.
 *
 * Exemple :
 *
 * QR Code
 *    ↓
 * EVT001-P0001
 *
 * Puis :
 *
 * 1. Vérification du participant
 * 2. Enregistrement de la présence
 * 3. Affichage du résultat
 */
async function qrCodeDetecte(qrCodeMessage) {


    /*
     * ========================================================
     * 1. RÉCUPÉRER LA ZONE D'AFFICHAGE
     * ========================================================
     */

    const message =
        document.getElementById("message");


    /*
     * Afficher l'ID détecté dans la console.
     *
     * Très utile pour le débogage.
     */

    console.log(
        "QR Code détecté :",
        qrCodeMessage
    );


    /*
     * Informer l'utilisateur que nous travaillons.
     */

    message.innerHTML =
        "⏳ Vérification du participant...";


    /*
     * ========================================================
     * 2. CONSTRUIRE L'URL DE VÉRIFICATION
     * ========================================================
     *
     * Exemple :
     *
     * https://.../exec?id=EVT001-P0001
     */

    const urlVerification =
        URL_BACKEND +
        "?id=" +
        encodeURIComponent(qrCodeMessage);


    try {


        /*
         * ====================================================
         * 3. CONTACTER APPS SCRIPT
         * ====================================================
         */

        const reponseVerification =
            await fetch(urlVerification);


        /*
         * Transformer la réponse en objet JavaScript.
         */

        const participant =
            await reponseVerification.json();


        console.log(
            "Réponse de vérification :",
            participant
        );


        /*
         * ====================================================
         * 4. VÉRIFIER QUE LE PARTICIPANT EXISTE
         * ====================================================
         */

        if (participant.trouve !== true) {


            /*
             * Le QR existe mais l'ID n'existe pas
             * dans notre base de participants.
             */

            message.innerHTML =

                "🔴 PARTICIPANT INCONNU<br><br>" +

                "ID : " +

                qrCodeMessage;


            console.log(
                "Participant inconnu."
            );


            /*
             * On arrête la fonction ici.
             *
             * Très important :
             * on ne doit PAS enregistrer une présence
             * pour un participant inconnu.
             */

            return;

        }


        /*
         * ====================================================
         * 5. PARTICIPANT TROUVÉ
         * ====================================================
         */

        message.innerHTML =

            "🟢 PARTICIPANT TROUVÉ<br><br>" +

            "<strong>" +

            participant.prenom +

            " " +

            participant.nom +

            "</strong><br><br>" +

            "⏳ Enregistrement de la présence...";


        console.log(
            "Participant trouvé :",
            participant
        );


        /*
         * ====================================================
         * 6. CONSTRUIRE L'URL D'ENREGISTREMENT
         * ====================================================
         *
         * Cette fois nous envoyons :
         *
         * ?action=presence&id=EVT001-P0001
         */

        const urlPresence =
            URL_BACKEND +
            "?action=presence&id=" +
            encodeURIComponent(qrCodeMessage);


        console.log(
            "URL d'enregistrement :",
            urlPresence
        );


        /*
         * ====================================================
         * 7. ENREGISTRER LA PRÉSENCE
         * ====================================================
         */

        const reponsePresence =
            await fetch(urlPresence);


        /*
         * Lire la réponse de notre fonction
         * enregistrerPresence().
         */

        const resultatPresence =
            await reponsePresence.json();


        console.log(
            "Résultat de l'enregistrement :",
            resultatPresence
        );


        /*
         * ====================================================
         * 8. AFFICHER LE RÉSULTAT
         * ====================================================
         *
         * Ici, nous allons utiliser la réponse de
         * enregistrerPresence().
         */

        if (resultatPresence.succes === true) {


            message.innerHTML =

                "🟢 PRÉSENCE ENREGISTRÉE<br><br>" +

                "<strong>" +

                participant.prenom +

                " " +

                participant.nom +

                "</strong><br><br>" +

                "ID : " +

                participant.id;


            console.log(
                "✅ Présence enregistrée avec succès."
            );


        } else {


            /*
             * Le participant existe mais quelque chose
             * a empêché l'enregistrement.
             */

            message.innerHTML =

                "⚠️ PARTICIPANT TROUVÉ<br><br>" +

                "<strong>" +

                participant.prenom +

                " " +

                participant.nom +

                "</strong><br><br>" +

                "❌ Présence non enregistrée";


            console.warn(
                "Présence non enregistrée :",
                resultatPresence
            );

        }


    }


    /*
     * ========================================================
     * 9. GESTION DES ERREURS
     * ========================================================
     */

    catch (erreur) {


        console.error(
            "Erreur pendant le traitement :",
            erreur
        );


        message.innerHTML =

            "⚠️ Une erreur est survenue<br><br>" +

            "Consulte la console du navigateur.";

    }

}

    </script>


</body>

</html>
