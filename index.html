<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contrôle de présence</title>


    <!--
        Chargement de la bibliothèque QR.
    -->
    <script src="https://unpkg.com/html5-qrcode"></script>


    <style>

        /* Ton CSS reste ici */

    </style>

</head>


<body>


    <div class="container">


        <!-- Titre de notre application -->

        <h1>
            📷 Contrôle de présence
        </h1>


        <!-- Description -->

        <p>
            Scanner les QR Codes des participants
        </p>


        <!--
            Cette zone recevra plus tard
            notre scanner QR.
        -->

       <!--
    =====================================================
    ZONE DU SCANNER
    =====================================================

    La bibliothèque html5-qrcode va construire
    automatiquement l'interface du scanner
    à l'intérieur de cette div.

    IMPORTANT :
    "reader" est simplement l'identifiant
    que nous avons choisi pour cette zone.
-->

<div id="reader"></div>


<!--
    =====================================================
    ZONE DU RÉSULTAT
    =====================================================

    C'est ici que nous afficherons
    le contenu du QR Code détecté.
-->

<div id="message">

    🔎 En attente d'un QR Code...

</div>

    </div>

<script>

    /*
        =====================================================
        FONCTION : qrCodeDetecte()
        =====================================================

        Cette fonction sera automatiquement appelée
        par la bibliothèque lorsqu'un QR Code est trouvé.

        "qrCodeMessage" contient le texte du QR Code.

        Exemple :

        QR Code
            ↓
        EVT001-P0001

        donc :

        qrCodeMessage = "EVT001-P0001"
    */

    function qrCodeDetecte(qrCodeMessage) {

        console.log("QR Code détecté :", qrCodeMessage);


        /*
            Nous récupérons la zone "message"
            créée précédemment.
        */

        const message =
            document.getElementById("message");


        /*
            Nous affichons le résultat.
        */

        message.innerHTML =
            "🟢 QR CODE DÉTECTÉ<br><br>" +
            "<strong>" +
            qrCodeMessage +
            "</strong>";

    }



    /*
        =====================================================
        FONCTION : erreurScan()
        =====================================================

        Cette fonction est appelée lorsque la caméra
        fonctionne mais qu'aucun QR Code n'est encore
        détecté.

        IMPORTANT :

        Ce n'est PAS une vraie erreur.

        Pendant que la caméra cherche un QR Code,
        cette fonction peut être appelée plusieurs fois.
    */

    function erreurScan(errorMessage) {

        console.log(
            "Recherche d'un QR Code..."
        );

    }



    /*
        =====================================================
        CRÉATION DU SCANNER
        =====================================================

        "reader" correspond à :

        <div id="reader"></div>

        La bibliothèque va créer le scanner
        à l'intérieur de cette zone.
    */

    const scanner = new Html5QrcodeScanner(

        "reader",

        {

            /*
                Nombre d'images analysées par seconde.

                10 est largement suffisant
                pour notre système.
            */

            fps: 10,


            /*
                Taille de la zone de détection.

                Ici : environ 250 × 250 pixels.
            */

            qrbox: 250

        }

    );



    /*
        =====================================================
        DÉMARRAGE DU SCANNER
        =====================================================

        On donne deux fonctions à la bibliothèque :

        1. qrCodeDetecte
           → appelée lorsqu'un QR est trouvé.

        2. erreurScan
           → appelée pendant la recherche.
    */

    scanner.render(

        qrCodeDetecte,

        erreurScan

    );

</script>
</body>

</html>
